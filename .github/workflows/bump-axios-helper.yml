name: Bump axios helper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bump axios to 1.21.1
        working-directory: code/src/AttendeeSite
        run: |
          npm pkg set 'dependencies.axios=^1.21.1'
          npm pkg set 'overrides.axios=$axios'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/AttendeeSite/package.json code/src/AttendeeSite/package-lock.json
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "Update axios to 1.21.1"; git push; fi
